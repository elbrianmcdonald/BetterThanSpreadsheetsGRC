services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: betterthanspreadsheetsGRC-app
    ports:
      - "${APP_PORT-80}:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-betterthanspreadsheetsGRC}
      - AUTH_SECRET=${AUTH_SECRET:?required}
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET is required. Run ./scripts/setup-env.sh (or scripts\\setup-env.ps1 on Windows) to generate one, or set CRON_SECRET in your .env file (openssl rand -hex 32).}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost}
      - AUTH_TRUST_HOST=true
      - CLAMAV_HOST=${CLAMAV_HOST:-}
      - CLAMSCAN_PATH=/usr/bin/clamdscan
      - ENABLE_CLAMAV=${ENABLE_CLAMAV:-false}
      - SEED_ON_STARTUP=${SEED_ON_STARTUP:-false}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-console}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - AWS_SES_REGION=${AWS_SES_REGION:-}
      - AWS_SES_ACCESS_KEY_ID=${AWS_SES_ACCESS_KEY_ID:-}
      - AWS_SES_SECRET_ACCESS_KEY=${AWS_SES_SECRET_ACCESS_KEY:-}
      - WORKER_ENABLED=${WORKER_ENABLED:-true}
      - WORKER_INTERVAL=${WORKER_INTERVAL:-30000}
      - CADDY_ADMIN_URL=${CADDY_ADMIN_URL:-http://caddy:2019}
      - HOSTNAME_CONFIG_DIR=/app/hostname-config
    volumes:
      - app_uploads:/app/uploads
      - hostname_config:/app/hostname-config
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - grc_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: betterthanspreadsheetsGRC-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?required}
      - POSTGRES_DB=${POSTGRES_DB:-betterthanspreadsheetsGRC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Wrapper re-syncs the superuser password with $POSTGRES_PASSWORD on
      # every start, so .env/volume drift (P1000 auth errors after rebuild)
      # self-heals without wiping the volume.
      - ./postgres-wrapper.sh:/usr/local/bin/postgres-wrapper.sh:ro
    # Invoke via `sh` so the script does not need to be marked executable —
    # Git on Windows strips the Unix exec bit otherwise.
    command: ["sh", "/usr/local/bin/postgres-wrapper.sh"]
    # No external port — only accessible within grc_network
    networks:
      - grc_network
    restart: unless-stopped
    healthcheck:
      # Not healthy until postgres accepts connections AND the wrapper has
      # ALTERed the superuser password to match the env (sentinel file). This
      # prevents the app from racing ahead with a stale password.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} && test -f /tmp/password-synced"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Production profile: Caddy reverse proxy with auto-HTTPS ---
  caddy:
    image: caddy:2-alpine
    container_name: betterthanspreadsheetsGRC-caddy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Shared volume with app — app writes cert.pem/key.pem here when BYOC
      # mode is selected in /admin/settings/hostname; Caddy reads them via
      # paths baked into the JSON config POSTed to its admin API.
      - hostname_config:/etc/caddy/dynamic:ro
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - grc_network
    restart: unless-stopped
    profiles:
      - production

  # --- ClamAV profile: optional malware scanning ---
  clamav:
    image: clamav/clamav:latest
    container_name: betterthanspreadsheetsGRC-clamav
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - grc_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamd", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    profiles:
      - clamav

  # Test Runner (for development/testing)
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-betterthanspreadsheetsGRC}
      - TEST_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-betterthanspreadsheetsGRC}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - grc_network
    command: tail -f /dev/null
    profiles:
      - test

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  app_uploads:
    driver: local
  clamav_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  hostname_config:
    driver: local

# Custom bridge network for service communication
networks:
  grc_network:
    driver: bridge
